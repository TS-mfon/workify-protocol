name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Foundry test dependencies
        working-directory: contracts/base
        run: forge install --no-git --shallow foundry-rs/forge-std@v1.9.7
      - name: Install pinned GenVM linter
        run: uv tool install genvm-linter==0.11.0
      - name: Cache compatible GenVM direct-test runners
        run: |
          mkdir -p "$HOME/.cache/gltest-direct"
          curl --fail --location --retry 3 \
            https://github.com/genlayerlabs/genvm/releases/download/v0.3.0-rc7/genvm-runners-all.tar.xz \
            --output "$HOME/.cache/gltest-direct/genvm-universal-v0.3.0-rc7.tar.xz"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:contracts
      - run: pnpm test:genlayer
      - run: pnpm build
